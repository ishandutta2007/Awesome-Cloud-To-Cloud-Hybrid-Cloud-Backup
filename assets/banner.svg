<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b19" />
      <stop offset="50%" stop-color="#0b132b" />
      <stop offset="100%" stop-color="#1c2541" />
    </linearGradient>

    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cyberCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <linearGradient id="glowPulse" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.2" />
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.3" />
      <circle cx="40" cy="40" r="1.5" fill="#475569" opacity="0.4" />
    </pattern>

    <!-- Animation Keyframes -->
    <style>
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(-12px) scale(1.02); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px) scale(1); }
        50% { transform: translateY(10px) scale(0.98); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.75; transform: scale(1.15); }
      }
      @keyframes dashFlow {
        to { stroke-dashoffset: -120; }
      }
      @keyframes particleFloat {
        0% { transform: translateY(0) translateX(0); opacity: 0.2; }
        50% { opacity: 0.8; }
        100% { transform: translateY(-70px) translateX(30px); opacity: 0; }
      }
      .cloud-left { animation: floatSlow 7s ease-in-out infinite; transform-origin: center; }
      .cloud-right { animation: floatReverse 8s ease-in-out infinite; transform-origin: center; }
      .orb-pulse { animation: pulseGlow 5s ease-in-out infinite; transform-origin: center; }
      .flowing-line { stroke-dasharray: 8, 8; animation: dashFlow 3s linear infinite; }
      .particle-1 { animation: particleFloat 4s infinite linear; }
      .particle-2 { animation: particleFloat 5s infinite linear 1.5s; }
      .particle-3 { animation: particleFloat 4.5s infinite linear 2.5s; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="420" fill="url(#bgGrad)" />
  <rect width="1200" height="420" fill="url(#grid)" />

  <!-- Dynamic Glowing Ambient Orbs (Background layer) -->
  <circle class="orb-pulse" cx="220" cy="180" r="140" fill="url(#glowPulse)" filter="url(#softGlow)" />
  <circle class="orb-pulse" cx="980" cy="200" r="160" fill="url(#cyberCyan)" opacity="0.25" filter="url(#softGlow)" style="animation-delay: -2.5s;" />

  <!-- Animated Data Flow Lines Between Cloud Workloads (Background/Middle) -->
  <g opacity="0.6">
    <path class="flowing-line" d="M 160 310 C 350 360, 850 360, 1040 310" fill="none" stroke="#38bdf8" stroke-width="2.5" />
    <path class="flowing-line" d="M 200 120 C 450 70, 750 70, 1000 120" fill="none" stroke="#818cf8" stroke-width="2" style="animation-direction: reverse;" />
  </g>

  <!-- Left Dynamic Element: Cloud Platform Node -->
  <g class="cloud-left" transform="translate(110, 140)">
    <rect x="-15" y="-15" width="130" height="90" rx="18" fill="#0f172a" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1.5" filter="url(#glow)" />
    <path d="M 25 45 A 15 15 0 0 1 50 30 A 22 22 0 0 1 85 35 A 16 16 0 0 1 85 55 L 25 55 Z" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linejoin="round" />
    <text x="50" y="22" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">SaaS / M365</text>
    <circle cx="20" cy="64" r="3" fill="#22c55e" />
    <text x="28" y="67" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">SYNCHRONIZED</text>
  </g>

  <!-- Right Dynamic Element: Immutable Vault / Target Cloud Node -->
  <g class="cloud-right" transform="translate(980, 140)">
    <rect x="-15" y="-15" width="130" height="90" rx="18" fill="#0f172a" fill-opacity="0.8" stroke="#a855f7" stroke-width="1.5" filter="url(#glow)" />
    <!-- Vault / Shield Lock -->
    <path d="M 50 25 L 35 32 L 35 48 C 35 58, 50 65, 50 65 C 50 65, 65 58, 65 48 L 65 32 Z" fill="none" stroke="#c084fc" stroke-width="2.5" stroke-linejoin="round" />
    <circle cx="50" cy="45" r="3" fill="#38bdf8" />
    <text x="50" y="20" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle">IMMUTABLE VAULT</text>
    <circle cx="25" cy="64" r="3" fill="#38bdf8" />
    <text x="33" y="67" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="9">AIR-GAPPED</text>
  </g>

  <!-- Floating Ambient Particles -->
  <circle class="particle-1" cx="300" cy="300" r="3" fill="#38bdf8" />
  <circle class="particle-2" cx="900" cy="280" r="3.5" fill="#a855f7" />
  <circle class="particle-3" cx="600" cy="90" r="2.5" fill="#818cf8" />

  <!-- FOREGROUND CONTENT: Header, Badge, Subtitle & Technology Pills (Unobstructed & High Contrast) -->
  <g id="foreground" transform="translate(600, 0)" text-anchor="middle">
    
    <!-- Top Category Pill / Badge -->
    <g transform="translate(0, 52)">
      <rect x="-145" y="-14" width="290" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1" />
      <circle cx="-125" cy="0" r="5" fill="#38bdf8">
        <animate attributeName="opacity" values="1;0.3;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="5" y="5" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1.2">ENTERPRISE CLOUD ARCHITECTURE</text>
    </g>

    <!-- Main Title (Gradual Vivid Cyan/Indigo/Purple) -->
    <text x="0" y="132" fill="url(#textGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="46" font-weight="900" letter-spacing="-1.5">
      Awesome Cloud-to-Cloud &amp; Hybrid Backup
    </text>

    <!-- Subtitle (Bright Silver/Slate for crisp readability) -->
    <text x="0" y="178" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="500" letter-spacing="0.2">
      Curated Landscape of Enterprise SaaS Protection &amp; Open-Source Replication Engines
    </text>

    <!-- Feature Description Line -->
    <text x="0" y="210" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="400">
      Multi-Cloud Disaster Recovery • Immutable Air-Gapped Vaults • Cross-Cloud S3 Replication • Ransomware Defense
    </text>

    <!-- Tech Badges / Interactive Style Pills -->
    <g transform="translate(0, 270)">
      <!-- Pill 1: SaaS Protection -->
      <g transform="translate(-270, 0)">
        <rect x="-80" y="-16" width="160" height="32" rx="16" fill="#0f172a" stroke="#38bdf8" stroke-width="1.2" />
        <text x="0" y="5" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">☁️ SaaS Data Defense</text>
      </g>

      <!-- Pill 2: Hybrid Orchestration -->
      <g transform="translate(-90, 0)">
        <rect x="-85" y="-16" width="170" height="32" rx="16" fill="#0f172a" stroke="#818cf8" stroke-width="1.2" />
        <text x="0" y="5" fill="#818cf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">🔄 Cross-Cloud Sync</text>
      </g>

      <!-- Pill 3: Open-Source Engines -->
      <g transform="translate(95, 0)">
        <rect x="-85" y="-16" width="170" height="32" rx="16" fill="#0f172a" stroke="#a855f7" stroke-width="1.2" />
        <text x="0" y="5" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">⚡ Open-Source Core</text>
      </g>

      <!-- Pill 4: Zero Trust & WORM -->
      <g transform="translate(275, 0)">
        <rect x="-80" y="-16" width="160" height="32" rx="16" fill="#0f172a" stroke="#10b981" stroke-width="1.2" />
        <text x="0" y="5" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700">🛡️ Immutable Vaults</text>
      </g>
    </g>

    <!-- Bottom Stat Summary Bar -->
    <g transform="translate(0, 345)">
      <line x1="-320" y1="0" x2="320" y2="0" stroke="#334155" stroke-width="1" />
      <text x="-210" y="24" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">ENTERPRISE SAAS LEADERS</text>
      <text x="0" y="24" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">SELF-HOSTED / CLI ENGINES</text>
      <text x="210" y="24" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600">TRANSPARENT TCO METRICS</text>
    </g>

  </g>
</svg>
