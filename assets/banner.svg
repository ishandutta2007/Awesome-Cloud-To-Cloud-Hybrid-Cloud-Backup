<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bgGrad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#070b19"/><stop offset="50%" stop-color="#0b132b"/><stop offset="100%" stop-color="#1c2541"/></linearGradient><linearGradient id="textGrad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="cyberCyan" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#00f2fe"/><stop offset="100%" stop-color="#4facfe"/></linearGradient><linearGradient id="glowPulse" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#6366f1" stop-opacity=".8"/><stop offset="100%" stop-color="#a855f7" stop-opacity=".2"/></linearGradient><filter id="glow" width="140%" height="140%" x="-20%" y="-20%"><feGaussianBlur result="blur" stdDeviation="8"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="softGlow" width="160%" height="160%" x="-30%" y="-30%"><feGaussianBlur result="blur" stdDeviation="16"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge></filter><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#334155" stroke-opacity=".3" stroke-width=".75" d="M 40 0 L 0 0 0 40"/><circle cx="40" cy="40" r="1.5" fill="#475569" opacity=".4"/></pattern><style>@keyframes floatSlow{0%{transform:translateY(0) scale(1)}50%{transform:translateY(-12px) scale(1.02)}}@keyframes floatReverse{0%{transform:translateY(0) scale(1)}50%{transform:translateY(10px) scale(.98)}}@keyframes pulseGlow{0%{opacity:.35;transform:scale(1)}50%{opacity:.75;transform:scale(1.15)}}@keyframes particleFloat{0%{transform:translateY(0) translateX(0);opacity:.2}50%{opacity:.8}}.cloud-left{animation:floatSlow 7s ease-in-out infinite;transform-origin:center}.cloud-right